<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CycleNourish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar + main on desktop, bottom tab bar on phones; the current phase colors the accent. */
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#ECF0E9; --ink:#1C2520; --muted:#56635B; --line:#D9E0D6;
  --men:#C8102E; --men-strong:#A50D26;
  --fol:#6F9874; --fol-strong:#4D7254;
  --ovu:#C4561B; --ovu-strong:#A44612;
  --lut:#3A8FD0; --lut-strong:#1F6FA8;
  --preg:#7A4E8C; --preg-strong:#653F75;
  --ok:#2E7D4F; --warn:#9A6008; --danger:#B42318; --on-accent:#FFFFFF;
  --accent:var(--fol); --accent-strong:var(--fol-strong);
  --font-display:"Young Serif", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm:8px; --r:14px; --r-lg:20px;
  --shadow:0 1px 2px rgba(28,37,32,.06), 0 6px 18px rgba(28,37,32,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101512; --surface:#171E1A; --surface-2:#1F2822; --ink:#E5EBE5; --muted:#9BA9A0; --line:#2B362F;
  --men:#FF5A69; --men-strong:#FF7A86; --fol:#9DC3A2; --fol-strong:#AED0B2; --ovu:#F2894A; --ovu-strong:#F6A06B;
  --lut:#74B9EC; --lut-strong:#8EC8F2; --preg:#C99BD8; --preg-strong:#D6B0E2;
  --ok:#6CC38D; --warn:#E3AA4C; --danger:#F07167; --on-accent:#0E1310;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171E1A; --surface-2:#1F2822; --ink:#E5EBE5; --muted:#9BA9A0; --line:#2B362F;
  --men:#FF5A69; --men-strong:#FF7A86; --fol:#9DC3A2; --fol-strong:#AED0B2; --ovu:#F2894A; --ovu-strong:#F6A06B;
  --lut:#74B9EC; --lut-strong:#8EC8F2; --preg:#C99BD8; --preg-strong:#D6B0E2;
  --ok:#6CC38D; --warn:#E3AA4C; --danger:#F07167; --on-accent:#0E1310;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.1}
h2{font-size:1.35rem;line-height:1.2}
h3{font-size:1.08rem;line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent-strong);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--font-display);font-size:1.2rem;line-height:1}
.brand-sub{font-size:.75rem;color:var(--muted)}
.chip-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.save-state{font-size:.75rem;color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100% - 56px)}
.sidenav{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px);align-self:start}
.navbtn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left;width:100%}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--ink)}
.navbtn[aria-current="page"] svg{color:var(--accent-strong)}
.sidenav .spacer{flex:1}
.focus-note{border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:.82rem;color:var(--muted);display:grid;gap:4px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;min-width:0}
.view{max-width:1100px;margin:0 auto;display:grid;gap:22px}
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidenav{display:none}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar .navbtn{flex-direction:column;gap:3px;font-size:.7rem;padding:9px 2px;border-radius:0;align-items:center;text-align:center}
  .tabbar .navbtn[aria-current="page"]{background:none;color:var(--accent-strong)}
  .brand-sub,.save-state{display:none}
}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.section{display:grid;gap:12px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.9rem;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent)}
.btn-ghost{border-color:transparent;background:none}
.btn-danger{color:var(--danger)}
.btn-sm{padding:6px 10px;font-size:.82rem;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.link{border:0;background:none;padding:0;color:var(--accent-strong);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.pill.ph{background:color-mix(in srgb,var(--c) 15%,var(--surface));border-color:color-mix(in srgb,var(--c) 35%,var(--surface));color:var(--ink)}
.pill.ph::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,var(--surface))}
.c-menstrual{--c:var(--men)} .c-follicular{--c:var(--fol)} .c-ovulation{--c:var(--ovu)} .c-luteal{--c:var(--lut)} .c-pregnant{--c:var(--preg)}
.pdots{display:inline-flex;gap:3px}
.pdots i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block}

/* Hero */
.hero{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;align-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line))}
.hero .ring{width:190px;height:190px;max-width:100%}
.hero-body{display:grid;gap:10px;min-width:0}
.hero p.lead{color:var(--muted);max-width:62ch}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr);justify-items:start}.hero .ring{width:160px;height:160px;justify-self:center}}
.preg-track{width:100%;display:grid;gap:8px}
.preg-bar{height:14px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--line)}
.preg-bar span{position:absolute;inset:0 auto 0 0;background:var(--preg);border-radius:999px}
.preg-ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.preg-big{font-family:var(--font-display);font-size:3rem;line-height:1}

.notice{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.notice.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.notice > div{flex:1;min-width:200px}

/* Meal cards */
.meal{display:grid;gap:10px;align-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0}
.meal .title{font-family:var(--font-display);font-size:1.1rem;line-height:1.25;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.meal .title:hover{text-decoration:underline;text-underline-offset:3px}
.meal-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.meal-meta b{color:var(--ink);font-weight:700}
.boost{font-size:.82rem;color:var(--muted);border-left:3px solid color-mix(in srgb,var(--accent) 60%,var(--line));padding-left:8px}
.meal.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.btn.logged{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.snack-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* Meters */
.meter{display:grid;gap:6px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter-val{font-size:1.5rem;font-weight:700;line-height:1}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:var(--c,var(--accent-strong))}

/* Prenatal */
.check-big{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface-2);cursor:pointer}
.check-big input{width:22px;height:22px;accent-color:var(--ok)}

/* Plan */
.plan-day{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));gap:8px;align-items:stretch}
.plan-dayhead{border-left:4px solid var(--c);padding:6px 10px;display:grid;gap:2px;align-content:center}
.plan-cell{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:grid;gap:4px;min-width:0}
.plan-cell:hover{border-color:var(--accent)}
.plan-cell .t{font-weight:600;font-size:.9rem;line-height:1.3}
.plan-cell.custom{border-style:dashed;border-color:var(--accent)}
.plan-colhead{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));gap:8px}
.plan-day.today .plan-dayhead{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-radius:0 10px 10px 0}
@media (max-width:820px){
  .plan-colhead{display:none}
  .plan-day{grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .plan-dayhead{grid-column:1/-1}
  .plan-cell .slotname{display:block}
}
.slotname{display:none}

/* Recipes */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--ink)}
.rcard{display:grid;gap:8px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px;min-width:0}
.rcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.rcard .t{font-family:var(--font-display);font-size:1.05rem;line-height:1.25}
.rcard .d{font-size:.85rem;color:var(--muted)}

/* Grocery */
.glist{list-style:none;margin:0;padding:0;display:grid}
.gitem{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gitem input{width:19px;height:19px;accent-color:var(--accent-strong);flex:none}
.gitem label{flex:1;min-width:0;cursor:pointer;display:grid}
.gitem .q{font-weight:600}
.gitem .u{font-size:.78rem;color:var(--muted)}
.gitem.checked .n{text-decoration:line-through;color:var(--muted)}
.cols{columns:2 340px;column-gap:14px}
.cols > .card{break-inside:avoid;margin-bottom:14px;display:block}

/* Log */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .d{font-weight:700;min-width:170px;text-align:center}

/* Forms */
.field{display:grid;gap:5px;min-width:0}
.field > span{font-size:.84rem;font-weight:600}
.field small{color:var(--muted);font-size:.78rem}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface)}
textarea.input{min-height:110px;resize:vertical}
.modecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.modecards{grid-template-columns:minmax(0,1fr)}}
.modecard{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;background:var(--surface);display:grid;gap:4px}
.modecard[aria-pressed="true"]{border-color:var(--accent-strong);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.modecard b{font-size:.98rem}
.modecard span{font-size:.82rem;color:var(--muted)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.84rem}

/* Modal */
.modal-back{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.5);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{width:min(480px,100%)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px;overflow-y:auto;display:grid;gap:16px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.15rem}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ing{margin:0;padding-left:20px;display:grid;gap:4px}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.stepper button{border:0;background:none;width:34px;height:32px;font-size:1.1rem}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.picklist{display:grid;gap:6px}
.pickitem{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.pickitem:hover,.pickitem[aria-current="true"]{border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-strong)}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;display:grid;gap:8px;justify-items:center}
.dropzone.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.found{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.found input{width:18px;height:18px}

/* Toasts */
#toasts{position:fixed;z-index:60;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;pointer-events:none}
@media (max-width:820px){#toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px))}}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);pointer-events:auto;max-width:420px}
.toast.error{background:var(--danger);color:#fff}
/* iPhone and touch fixes */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,input,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.modal-body{min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
input[type="date"].input{-webkit-appearance:none;appearance:none;min-height:42px;display:block}
input[type="date"].input::-webkit-date-and-time-value{text-align:left}
#mode-chip{max-width:min(52vw,320px);overflow:hidden}
#mode-chip-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:none){ .rcard:hover{box-shadow:none;border-color:var(--line)} .btn:hover{background:var(--surface)} .btn-primary:hover{background:var(--accent-strong)} }
@media (max-width:820px){
  .input,select.input,textarea.input,.search,input[type="number"]{font-size:16px}
  .btn{min-height:44px} .btn-sm{min-height:40px;padding:8px 12px}
  .icon-btn{min-width:40px;min-height:40px;justify-content:center;align-items:center}

  .modal{width:100%;border-radius:20px 20px 0 0;max-height:100%}
  .modal-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .modal-head,.modal-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .section-head > .row{width:100%}
  .datenav .d{min-width:0;flex:1}
  .hero{padding:18px}
  .card{padding:16px}
}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}}}

/* ---------- Storage ---------- */
const Store = { ready:false, kind:"loading", backend:null, failed:false };
const LOCAL_KEY = "cyclenourish_v3";
const localBackend = {
  kind:"browser",
  read(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); } catch { return {}; } },
  async loadAll(){ return this.read(); },
  async set(k, v){ const m = this.read(); m[k] = v; try { localStorage.setItem(LOCAL_KEY, JSON.stringify(m)); } catch { throw {code:"storage"}; } },
  async del(k){ const m = this.read(); delete m[k]; try { localStorage.setItem(LOCAL_KEY, JSON.stringify(m)); } catch {} }
};
const caps = {};
function cap(name){
  if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  if (!caps[name]) caps[name] = window.claude.use(name).catch(() => null);
  return caps[name];
}
async function initStore(){
  let backend = localBackend;
  const [db, user] = await Promise.all([cap("db"), cap("user")]);
  if (db && user) {
    let id = null;
    try { id = await user.id(); } catch {}
    if (id) {
      const col = db.collection("data/users/" + id);
      backend = {
        kind:"account",
        async loadAll(){ const snap = await col.get(); const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = clone(d.data()); }); return m; },
        set:(k, v) => col.doc(k).set(v),
        del:(k) => col.doc(k).delete()
      };
    }
  }
  let data = {};
  try { data = await backend.loadAll(); }
  catch (e) {
    if (backend.kind === "account") { backend = localBackend; data = await backend.loadAll(); toast("Couldn't reach your account storage. Saving in this browser for now.", "error"); }
  }
  Store.backend = backend; Store.kind = backend.kind;
  applyData(data);
  Store.ready = true;
  updateSaveState();
  render();
}
function applyData(m){
  if (m.settings) S.settings = Object.assign(clone(DEFAULT_SETTINGS), m.settings, {customPrenatal:Object.assign(clone(DEFAULT_SETTINGS.customPrenatal), m.settings.customPrenatal || {})});
  if (m.plan) S.plan = {days:m.plan.days || {}};
  if (m.grocery) S.grocery = {checked:m.grocery.checked || {}, extras:m.grocery.extras || []};
  S.recipes = {}; S.logs = {};
  for (const [k, v] of Object.entries(m)) {
    if (k.startsWith("recipe_") && v && v.title) S.recipes[v.id] = normalizeRecipe(v);
    if (k.startsWith("log_") && v && isDate(v.date)) S.logs[v.date] = {date:v.date, meals:Array.isArray(v.meals) ? v.meals : [], prenatal:!!v.prenatal};
  }
}
const timers = {}, chains = {};
function docFor(key){
  if (key === "settings") return S.settings;
  if (key === "plan") return S.plan;
  if (key === "grocery") return S.grocery;
  if (key.startsWith("recipe_")) return S.recipes[key.slice(7)];
  if (key.startsWith("log_")) return S.logs[key.slice(4)];
}
function persist(key){
  if (!Store.ready) return;
  clearTimeout(timers[key]);
  timers[key] = setTimeout(() => {
    const val = docFor(key);
    const body = val === undefined ? undefined : clone(val);
    chains[key] = (chains[key] || Promise.resolve())
      .then(() => body === undefined ? Store.backend.del(key) : Store.backend.set(key, body))
      .then(() => { if (Store.failed) { Store.failed = false; updateSaveState(); } })
      .catch(onSaveError);
  }, 350);
}
function onSaveError(e){

  const code = e && e.code;
  if (code === "quota_exceeded") toast("Storage is full. Export a backup and delete old recipes or logs.", "error");
  else if (code === "invalid_argument") toast("This view can't save changes. Open the app from your own account to save.", "error");
  else toast("Couldn't save your last change. Check your connection and try again.", "error");
}
function updateSaveState(){
  const el = $("#save-state"); if (!el) return;

}

/* ---------- Cycle math ---------- */
function phaseRanges(L, P){ const ov = L - 14; return {menstrual:[1,P], follicular:[P+1, ov-2], ovulation:[ov-1, ov+1], luteal:[ov+2, L], ov}; }
function phaseForDay(day, L, P){ const r = phaseRanges(L, P); for (const k of PHASE_KEYS) if (day >= r[k][0] && day <= r[k][1]) return k; return "luteal"; }
function cycleAt(date){
  const s = S.settings;
  if (s.mode === "pregnant") return pregAt(date);
  const L = clamp(s.cycleLen, 21, 45), P = clamp(s.periodLen, 2, 10);
  const example = !isDate(s.lastPeriod);
  const start = example ? addDays(ui.today, -8) : s.lastPeriod;
  const d = diffDays(date, start);
  let day, late = 0, projected = false;
  if (d >= L && d < L + 14) { day = d + 1; late = d - L + 1; }
  else { day = ((d % L) + L) % L + 1; projected = d >= L; }
  let phase = late ? "luteal" : phaseForDay(day, L, P);
  const manual = !!(s.phaseOverride && PHASES[s.phaseOverride]);
  if (manual) phase = s.phaseOverride;
  const ov = L - 14;
  const fertile = !late && day >= ov - 5 && day <= ov + 1;
  return {kind:"cycle", day, L, P, phase, late, projected, example, manual, fertile, ov, nextIn: late ? 0 : L - day + 1};
}
function pregAt(date){
  const s = S.settings;
  let gest, example = false;
  if (isDate(s.dueDate)) gest = 280 - diffDays(s.dueDate, date);
  else if (isDate(s.lastPeriod)) gest = diffDays(date, s.lastPeriod);
  else { gest = 98; example = true; }
  gest = clamp(gest, 0, 300);
  const week = Math.floor(gest / 7);
  const tri = week < 14 ? 1 : week < 28 ? 2 : 3;
  return {kind:"preg", gest, week, dayIn:gest % 7, tri, dueIn:280 - gest, example, phase:"pregnant"};
}
function accentFor(ci){ return ci.kind === "preg" ? "preg" : PHASES[ci.phase].color; }

/* Ingredient parsing for manual entry and imports */

  can:"can",cans:"can",clove:"clove",cloves:"clove",slice:"slice",slices:"slice",bunch:"bunch",bunches:"bunch",scoop:"scoop",scoops:"scoop",
  head:"head",heads:"head",pint:"pint",pints:"pint",package:"package",packages:"package",pkg:"package",block:"block",blocks:"block",
  handful:"handful",handfuls:"handful",pinch:"pinch",pinches:"pinch",dash:"dash",stalk:"stalk",stalks:"stalk",sprig:"sprig",sprigs:"sprig",quart:"quart",quarts:"quart",jar:"jar",jars:"jar",bag:"bag",bags:"bag"};

}

/* ---------- Plan & grocery ---------- */
const SLOT_OFFSET = {breakfast:0, lunch:1, dinner:2, snack:3};
function suggestFor(date, slot){
  const ci = cycleAt(date);
  const pool = allRecipes().filter(r => r.meal === slot);
  let list = ci.kind === "preg" ? pool : pool.filter(r => fits(r, ci.phase));
  if (!list.length) list = pool;
  if (!list.length) return null;
  const n = Math.floor(diffDays(date, "2026-01-05") / 2) + SLOT_OFFSET[slot];  // repeats each pick for 2 days so leftovers get used
  return list[((n % list.length) + list.length) % list.length].id;
}
function plannedId(date, slot){
  const chosen = S.plan.days[date] && S.plan.days[date][slot];
  if (chosen && recipeById(chosen)) return chosen;
  return suggestFor(date, slot);
}
function setPlan(date, slot, id){
  S.plan.days[date] = S.plan.days[date] || {};
  if (id) S.plan.days[date][slot] = id; else delete S.plan.days[date][slot];
  if (!Object.keys(S.plan.days[date]).length) delete S.plan.days[date];
  const cutoff = addDays(ui.today, -30);
  for (const d of Object.keys(S.plan.days)) if (d < cutoff) delete S.plan.days[d];
  persist("plan");
}
const weekStart = () => addDays(ui.today, ui.weekOffset * 7);
const weekDays = () => Array.from({length:7}, (_, i) => addDays(weekStart(), i));

function itemKey(name){
  let t = String(name).toLowerCase().replace(/\(.*?\)/g, "").replace(/[,;].*$/, "").replace(/\s+/g, " ").trim();
  t = t.split(" ").map(w => w.endsWith("oes") ? w.slice(0, -2) : w.endsWith("ies") && w.length > 4 ? w.slice(0, -3) + "y" : w.endsWith("s") && !w.endsWith("ss") && w.length > 3 ? w.slice(0, -1) : w).join(" ");
  return t;
}
function buildGrocery(){
  const counts = {};
  const days = weekDays();
  for (const d of days) for (const s of SLOTS) { const id = plannedId(d, s.key); if (id) counts[id] = (counts[id] || 0) + 1; }
  const hh = clamp(S.settings.household, 1, 12);
  const items = {};
  for (const [id, count] of Object.entries(counts)) {
    const r = recipeById(id); if (!r) continue;
    const factor = Math.ceil((count * hh / r.servings) * 2) / 2;  // round up to half batches
    for (const ing of r.ingredients) {
      const key = itemKey(ing.item);
      if (!key) continue;
      const it = items[key] || (items[key] = {key, name:ing.item, section:ing.section || guessSection(ing.item), amounts:{}, open:false, recipes:new Set(), staple:STAPLES.includes(key) || STAPLES.includes(ing.item.toLowerCase())});
      it.recipes.add(r.title);
      if (ing.qty == null) it.open = true; else { let u = normUnit(ing.unit), q = ing.qty * factor;
        if (VOL[u]) { q *= VOL[u]; u = "tbsp"; } else if (WT[u]) { q *= WT[u]; u = "oz"; }
        it.amounts[u] = (it.amounts[u] || 0) + q; }
    }
  }
  return {items:Object.values(items), counts, meals:Object.values(counts).reduce((a, b) => a + b, 0)};
}
function fmtQty(q){
  if (q >= 10) return String(Math.round(q));
  const w = Math.floor(q), f = q - w;
  const opts = [[0,""],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
  let best = opts[0]; for (const o of opts) if (Math.abs(o[0] - f) < Math.abs(best[0] - f)) best = o;
  const whole = best[0] === 1 ? w + 1 : w;
  return (whole ? String(whole) : "") + best[1] || "0";
}
const PLURAL = {cup:"cups",can:"cans",clove:"cloves",slice:"slices",bunch:"bunches",scoop:"scoops",head:"heads",pint:"pints",package:"packages",block:"blocks",stalk:"stalks",sprig:"sprigs",quart:"quarts",handful:"handfuls",pinch:"pinches",jar:"jars",bag:"bags"};
const unitLabel = (u, q) => q > 1 && PLURAL[u] ? PLURAL[u] : u;
const VOL = {cup:16, tbsp:1, tsp:1/3}, WT = {lb:16, oz:1};
function fmtAmounts(it){
  const parts = Object.entries(it.amounts).map(([u, q]) => {
    if (u === "tbsp") { if (q >= 4) { u = "cup"; q = q / 16; } else if (q < 1) { u = "tsp"; q = q * 3; } }
    if (u === "oz" && q >= 16) { u = "lb"; q = q / 16; }
    const qq = u === "" ? Math.ceil(q) : q; return (fmtQty(qq) + " " + unitLabel(u, qq)).trim(); });
  if (it.open) parts.push("as needed");
  return parts.join(" + ");

/* ---------- Nutrition ---------- */
function brandInfo(){
  const k = S.settings.prenatalBrand;
  return k === "custom" ? Object.assign({name:BRANDS.custom.name}, S.settings.customPrenatal) : (BRANDS[k] || BRANDS.ritual);
}
const prenatalOn = () => S.settings.mode !== "avoid" || S.settings.takesPrenatal;
function targets(){
  const m = S.settings.mode, preg = m === "pregnant";
  return {protein:clamp(S.settings.proteinGoal, 10, 120) * 3, perMeal:clamp(S.settings.proteinGoal, 10, 120), fiber:clamp(S.settings.fiberGoal, 10, 80),
    iron:preg ? 27 : 18, ironUL:45, calcium:1000, vitC:preg ? 85 : 75, folate:preg ? 600 : 400, vitD:600, vitB12:preg ? 2.6 : 2.4, dha:m === "avoid" ? 0 : 200};
}
function getLog(d){ return S.logs[d] || {date:d, meals:[], prenatal:false}; }
function saveLog(d, log){
  if (!log.meals.length && !log.prenatal) { delete S.logs[d]; } else S.logs[d] = log;
  persist("log_" + d);
}
function totals(d){
  const log = getLog(d);
  const t = {protein:0, carbs:0, fat:0, fiber:0, iron:0, calcium:0, vitC:0, foodIron:0, suppIron:0};
  for (const m of log.meals) for (const k of ["protein","carbs","fat","fiber","iron","calcium","vitC"]) t[k] += +m[k] || 0;

  return n;
}
function logRecipe(date, slot, id, servings = 1){
  const r = recipeById(id); if (!r) return;
  const log = clone(getLog(date));
  const n = r.nut;
  log.meals.push({id:uid(), slot, name:r.title, recipeId:id, servings, protein:r1(n.protein*servings), carbs:r1(n.carbs*servings), fat:r1(n.fat*servings), fiber:r1(n.fiber*servings), iron:r1(n.iron*servings), calcium:Math.round(n.calcium*servings), vitC:Math.round(n.vitC*servings)});
  saveLog(date, log);
}

/* ---------- UI: toasts & modals ---------- */
function toast(msg, type = "info"){
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), type === "error" ? 6000 : 3200);
}
let modalState = null;
function openModal(html, {size = "", onClose} = {}){
  closeModal(true);
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-back" data-back="1"><div class="modal ${size}" role="dialog" aria-modal="true">${html}</div></div>`;
  modalState = {onClose, returnTo:document.activeElement};
  const first = root.querySelector("input:not([type=hidden]),select,textarea,button:not([data-act=close-modal])") || root.querySelector("button");
  first && first.focus();
  return root.querySelector(".modal");
}
function closeModal(silent){
  const root = $("#modal-root");
  if (!root.innerHTML) return;
  const st = modalState; modalState = null;
  root.innerHTML = "";
  if (st && st.onClose && !silent) st.onClose();
  if (st && st.returnTo && document.contains(st.returnTo)) st.returnTo.focus();
}
const modalHead = (title, sub = "") => `<div class="modal-head"><div class="section" style="gap:4px">${sub}<h2>${esc(title)}</h2></div><button class="icon-btn" data-act="close-modal" aria-label="Close">${ICONS.close}</button></div>`;
document.addEventListener("keydown", e => {
  if (!$("#modal-root").innerHTML) return;
  if (e.key === "Escape") { e.preventDefault(); closeModal(); }
  if (e.key === "Tab") {
    const f = [...$("#modal-root").querySelectorAll("button,input,select,textarea,a[href],[tabindex]:not([tabindex='-1'])")].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
$("#modal-root").addEventListener("mousedown", e => { if (e.target.dataset && e.target.dataset.back) closeModal(); });

function ringSVG(ci){
  const L = ci.L, R = 52, C = 2 * Math.PI * R, rg = phaseRanges(L, ci.P);
  const segs = PHASE_KEYS.map(k => {
    const [a, b] = rg[k], len = Math.max(0, b - a + 1);
    if (!len) return "";
    const dash = Math.max(0, len / L * C - 2.5);
    return `<circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--${PHASES[k].color})" stroke-width="11" stroke-dasharray="${dash} ${C}" stroke-dashoffset="${-((a - 1) / L * C)}" transform="rotate(-90 60 60)" opacity="${k === ci.phase ? 1 : .32}"/>`;
  }).join("");
  let fert = "";
  if (S.settings.mode === "ttc") {
    const R2 = 64, C2 = 2 * Math.PI * R2, a = ci.ov - 5, len = 7;
    fert = `<circle cx="60" cy="60" r="${R2}" fill="none" stroke="var(--ovu)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${len / L * C2} ${C2}" stroke-dashoffset="${-((a - 1) / L * C2)}" transform="rotate(-90 60 60)"/>`;
  }
  const pos = Math.min(ci.day, L) - .5, ang = pos / L * 2 * Math.PI - Math.PI / 2;
  const x = 60 + R * Math.cos(ang), y = 60 + R * Math.sin(ang);
  return `<svg class="ring" viewBox="-10 -10 140 140" role="img" aria-label="Day ${ci.day} of a ${L}-day cycle, ${PHASES[ci.phase].name} phase">
    ${segs}${fert}
    <circle cx="${x}" cy="${y}" r="7.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
    <text x="60" y="47" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif" font-weight="700" letter-spacing="1.2">DAY</text>
    <text x="60" y="76" text-anchor="middle" font-size="34" fill="var(--ink)" font-family="'Young Serif', Georgia, serif">${ci.day}</text>
    <text x="60" y="91" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif">of ${L}</text></svg>`;
}

    <div class="bar" role="progressbar" aria-label="${label}" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%;${val >= target ? "--c:var(--ok)" : ""}"></span></div>

}

const libLoads = {};
function loadScript(url){
  if (!libLoads[url]) libLoads[url] = new Promise((res, rej) => { const el = document.createElement("script"); el.src = url; el.onload = res; el.onerror = () => { delete libLoads[url]; rej(new Error("load")); }; document.head.appendChild(el); });
  return libLoads[url];
}
const decodeXml = t => t.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&");
async function docxText(file){
  await loadScript(LIBS.jszip);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const doc = zip.file("word/document.xml");
  if (!doc) throw new Error("not docx");
  const xml = await doc.async("string");
  return decodeXml(xml.replace(/<w:tab\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n").replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, ""));
}
async function pdfText(file){
  await loadScript(LIBS.pdfworker); await loadScript(LIBS.pdf);  // worker script first so pdf.js runs it on the page
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfworker;
  const pdf = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 80); i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    out.push(tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join(""));
  }
  return out.join("\n\n");
}
async function xlsxSheets(file){
  await loadScript(LIBS.xlsx);
  const wb = window.XLSX.read(await file.arrayBuffer(), {type:"array"});
  return wb.SheetNames.map(n => ({name:n, csv:window.XLSX.utils.sheet_to_csv(wb.Sheets[n], {blankrows:false})})).filter(x => x.csv.trim());
}
async function runImport(){
  const inp = $("#scan-file"); const files = inp ? [...inp.files] : [];
  if (!files.length) { setScanStatus("Choose at least one file."); return; }
  scan.busy = true;
  const found = [], texts = [], skipped = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i], name = file.name.toLowerCase();
    setScanStatus(`Opening ${file.name} (${i + 1} of ${files.length})…`);
    try {
      if (name.endsWith(".json")) {
        const data = JSON.parse(await file.text());
        if (data && data.cyclenourishBackup) { scan.busy = false; restoreBackup(data); return; }
        const list = Array.isArray(data) ? data : Array.isArray(data.recipes) ? data.recipes : [];
        const got = list.filter(x => x && x.title).map(x => normalizeRecipe(Object.assign({}, x, {id: x.id && !BUILTIN.some(b => b.id === String(x.id)) ? String(x.id) : uid()})));
        got.length ? found.push(...got) : skipped.push(file.name);
      } else if (name.endsWith(".csv")) {
        const text = await file.text(), got = csvToRecipes(text);
        got.length ? found.push(...got) : texts.push(text);
      } else if (/\.xlsx?$/.test(name)) {
        for (const sh of await xlsxSheets(file)) { const got = csvToRecipes(sh.csv); got.length ? found.push(...got) : texts.push(`Sheet "${sh.name}":\n${sh.csv}`); }
      } else if (name.endsWith(".docx")) {
        texts.push(await docxText(file));
      } else if (name.endsWith(".pdf")) {
        const t = await pdfText(file);
        if (t.replace(/\s/g, "").length < 80) skipped.push(file.name + " (scanned PDF: use Photos with screenshots of its pages)"); else texts.push(t);
      } else if (/\.(txt|md|html?)$/.test(name) || file.type.startsWith("text/")) {
        let t = await file.text();
        if (/\.html?$/.test(name)) { const d = new DOMParser().parseFromString(t, "text/html"); t = d.body ? (d.body.innerText || d.body.textContent) : t; }
        texts.push(t);
      } else skipped.push(file.name + (name.endsWith(".doc") ? " (old Word format: save it as .docx)" : " (unsupported type)"));
    } catch (e) {
      skipped.push(file.name + (e && e.message === "load" ? " (couldn't load the file reader; check your connection)" : " (couldn't be read)"));
    }
  }
  scan.busy = false;
  const plain = texts.map(t => t.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim()).filter(Boolean);
  const note = skipped.length ? `Skipped: ${skipped.join("; ")}.` : "";
  if (plain.length) {
    const sample = await cap("sample");
    if (!sample) {
      if (!found.length) { setScanStatus("Reading Word, PDF, and text recipes needs Claude, which isn't available in this view. " + note); return; }
    } else {
      const chunks = plain.flatMap(t => chunkText(t));
      runScan(chunks.map(c => ({prompt:scannerPrompt("text", c)})), found, note);
      return;
    }
  }
  if (!found.length) { setScanStatus("No recipes found. " + note); return; }
  scan.found = found; scan.sel = Object.fromEntries(found.map((_, i) => [i, true])); scan.msg = note; scannerModal();
}
async function estimateNutrition(){
  const sample = await cap("sample"), st = $("#est-status");
  if (!sample) { st.textContent = "Claude isn't available in this view."; return; }
  const ing = $("#rf-ing").value.trim();
  if (!ing) { st.textContent = "Add ingredients first."; return; }
  st.textContent = "Estimating…";
  try {
    const res = await sample.json(`Estimate nutrition PER SERVING for this recipe, which makes ${+$("#rf-serv").value || 2} servings.
Ingredients:
${ing}
Reply with only JSON: {"protein":g,"carbs":g,"fat":g,"fiber":g,"iron":mg,"calcium":mg,"vitC":mg}. Whole numbers, iron with one decimal.`, {modelTier:"quick"});
    for (const k of ["protein","carbs","fat","fiber","iron","calcium","vitC"]) if (res && res[k] != null && !isNaN(+res[k])) $("#rf-" + k).value = +res[k];
    $("#rf-est").value = "1";
    st.textContent = "Estimated. Adjust if you know better values.";
  } catch (e) { st.textContent = SAMPLE_ERR[e && e.code] || "Couldn't estimate. Try again."; }
}

function countName(it){
  const n = it.name, keys = Object.keys(it.amounts);
  if (keys.length === 1 && keys[0] === "" && Math.ceil(it.amounts[""]) > 1 && !/s$/i.test(n)) return /(potato|tomato)$/i.test(n) ? n + "es" : n + "s";
  return n;
}
function groceryText(){
  const g = buildGrocery(), ch = S.grocery.checked, lines = [`Groceries ${fmtDate(weekDays()[0])} – ${fmtDate(weekDays()[6])}`];
  for (const [k, l] of SECTIONS) { const list = g.items.filter(i => !i.staple && i.section === k && !ch[i.key]); if (list.length) { lines.push("", l.toUpperCase()); list.forEach(i => lines.push(`- ${fmtAmounts(i)} ${countName(i)}`)); } }
  const ex = S.grocery.extras.filter(x => !x.done); if (ex.length) { lines.push("", "EXTRAS"); ex.forEach(x => lines.push("- " + x.name)); }
  const st = g.items.filter(i => i.staple && !ch[i.key]); if (st.length) { lines.push("", "CHECK PANTRY"); st.forEach(i => lines.push("- " + i.name)); }
  return lines.join("\n");
}

      ${prenatalOn() ? `<label class="field"><span>Brand</span><select class="input" id="set-prenatalBrand" data-set="prenatalBrand">${Object.entries(BRANDS).map(([k, v]) => `<option value="${k}" ${s.prenatalBrand === k ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select><small>Listed values are approximate. Formulas change, so check your label.</small></label>
        ${s.prenatalBrand === "custom" ? `<div class="grid g3">${[["iron","Iron (mg)"],["folate","Folate (mcg DFE)"],["vitD","Vitamin D (IU)"],["vitB12","B12 (mcg)"],["calcium","Calcium (mg)"],["dha","DHA (mg)"]].map(([k, l]) => `<label class="field"><small>${l}</small><input class="input num" type="number" min="0" step="0.1" id="set-cp-${k}" data-set="customPrenatal.${k}" value="${s.customPrenatal[k]}"></label>`).join("")}</div>` :
        `<p class="small num">Per dose: iron ${b.iron} mg · folate ${b.folate} mcg · vitamin D ${b.vitD} IU · B12 ${b.vitB12} mcg · calcium ${b.calcium} mg · DHA ${b.dha} mg. <button class="link" data-act="customize-brand">Edit values</button></p>`}` : ""}
    </section>
    <section class="card section"><h2>Your data</h2>
      <p>${Store.kind === "account" ? "Your recipes, plan, and logs are saved to your Claude account. Only you can see them, and they sync wherever you open this app while signed in." : "Your data is saved in this browser only. Clearing browser data will erase it, so export a backup now and then."}</p>
      <p class="small muted">To keep a copy in OneDrive or Google Drive, tap Export backup. On iPhone, choose Save to Files, then OneDrive or Google Drive. To restore, use Import backup and pick that file.${s.lastBackup ? ` Last backup: ${esc(fmtDate(s.lastBackup, {month:"short", day:"numeric", year:"numeric"}))}.` : " No backup yet."}</p>
      <div class="row"><button class="btn" data-act="export">Export backup</button><button class="btn" data-act="scan-import">Import backup or recipes</button><button class="btn btn-ghost btn-danger" data-act="erase-ask">Erase all data</button></div>
      <div id="erase-confirm"></div></section>`;
}
function exportData(){
  return {cyclenourishBackup:1, exportedAt:new Date().toISOString(), settings:S.settings, plan:S.plan, grocery:S.grocery, recipes:Object.values(S.recipes), logs:Object.values(S.logs)};
}
async function doExport(){
  const json = JSON.stringify(exportData(), null, 2);
  const dl = await cap("downloads");
  if (dl) {
    try { await dl.save({filename:`cyclenourish-backup-${ui.today}.json`, data:json}); S.settings.lastBackup = ui.today; persist("settings"); render(); toast("Backup saved"); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  copyText(json, "Backup");
}
function restoreBackup(data){
  if (data.settings) { S.settings = Object.assign(clone(DEFAULT_SETTINGS), data.settings); persist("settings"); }
  if (data.plan) { S.plan = {days:data.plan.days || {}}; persist("plan"); }
  if (data.grocery) { S.grocery = {checked:data.grocery.checked || {}, extras:data.grocery.extras || []}; persist("grocery"); }
  let n = 0;
  (data.recipes || []).forEach(x => { if (x && x.title) { const r = normalizeRecipe(x); S.recipes[r.id] = r; persist("recipe_" + r.id); n++; } });
  (data.logs || []).forEach(x => { if (x && isDate(x.date)) { S.logs[x.date] = {date:x.date, meals:x.meals || [], prenatal:!!x.prenatal}; persist("log_" + x.date); } });
  closeModal(true); render(); toast(`Backup restored: ${n} recipes and ${(data.logs || []).length} days of logs`);
}

/* ---------- Events ---------- */
function go(view){ ui.view = view; if (location.hash.slice(1) !== view) { try { history.replaceState(null, "", "#" + view); } catch { location.hash = view; } } render(); $("#main").focus({preventScroll:true}); window.scrollTo(0, 0); }
function needReady(){ if (!Store.ready) { toast("Still loading your data. Try again in a moment."); return false; } return true; }
const ACT = {
  "go": el => go(el.dataset.view),
  "close-modal": () => closeModal(),
  "mode": el => { if (!needReady()) return; S.settings.mode = el.dataset.mode; persist("settings"); render(); toast("Mode: " + MODES[el.dataset.mode].name); },
  "finish-setup": () => {
    if (!needReady()) return;
    const s = S.settings;
    if (s.mode === "pregnant") { const due = $("#setup-due").value; if (!isDate(due)) { toast("Add your due date.", "error"); return; } s.dueDate = due; }
    else { const last = $("#setup-last").value; if (!isDate(last)) { toast("Add the first day of your last period.", "error"); return; }
      s.lastPeriod = last; s.periodStarts = [...new Set([...(s.periodStarts || []), last])]; s.cycleLen = clamp($("#setup-len").value, 21, 45); s.periodLen = clamp($("#setup-plen").value, 2, 10); }
    s.setupDone = true; persist("settings"); render(); toast("Personalized to your cycle");
  },
  "period-today": () => { if (!needReady()) return; const s = S.settings, t = ui.today;
    if (isDate(s.lastPeriod) && s.lastPeriod !== t && diffDays(t, s.lastPeriod) < 10) { toast("Your last period started less than 10 days ago. Edit dates in Profile if needed."); return; }
    s.lastPeriod = t; s.periodStarts = [...new Set([...(s.periodStarts || []), t])]; s.phaseOverride = ""; s.setupDone = true; persist("settings"); render(); toast("Logged. Day 1 starts today."); },
  "clear-override": () => { S.settings.phaseOverride = ""; persist("settings"); render(); },
  "del-start": el => { const s = S.settings; s.periodStarts = (s.periodStarts || []).filter(x => x !== el.dataset.d); if (s.lastPeriod === el.dataset.d) s.lastPeriod = s.periodStarts.slice().sort().pop() || ""; persist("settings"); render(); },
  "use-avg": el => { S.settings.cycleLen = +el.dataset.v; persist("settings"); render(); toast(`Cycle length set to ${el.dataset.v} days`); },
  "open-recipe": el => recipeModal(el.dataset.id),
  "rserv": el => recipeModal(el.dataset.id, +el.dataset.v),
  "pick": el => pickerModal(el.dataset.date, el.dataset.slot),
  "choose": el => { if (!needReady()) return; setPlan(el.dataset.date, el.dataset.slot, el.dataset.id); closeModal(true); render(); toast(el.dataset.id ? "Meal updated" : "Back to the suggestion"); },
  "add-to-plan": el => { if (!needReady()) return; const d = $("#add-day").value, s = $("#add-slot").value; setPlan(d, s, el.dataset.id); render(); toast(`Added to ${SLOTS.find(x => x.key === s).name.toLowerCase()} on ${fmtDate(d)}`); },
  "toggle-log": el => { if (!needReady()) return; const {date, slot, id} = el.dataset; const log = clone(getLog(date));
    const i = log.meals.findIndex(m => m.recipeId === id && m.slot === slot);
    if (i >= 0) { log.meals.splice(i, 1); saveLog(date, log); toast("Removed from log"); } else { logRecipe(date, slot, id); toast("Logged 1 serving"); }
    render(); },
  "week": el => { ui.weekOffset = clamp(ui.weekOffset + +el.dataset.dir, 0, 3); render(); },
  "reset-week": () => { weekDays().forEach(d => delete S.plan.days[d]); persist("plan"); render(); toast("Week reset to suggestions"); },
  "rmeal": el => { ui.rMeal = el.dataset.v; render(); },
  "rsource": el => { ui.rSource = el.dataset.v; render(); },
  "rfit": () => { ui.rFit = !ui.rFit; render(); },
  "new-recipe": () => editorModal(null),
  "edit-recipe": el => editorModal(recipeById(el.dataset.id)),
  "dup-recipe": el => { const r = clone(recipeById(el.dataset.id)); r.id = uid(); r.title += " (my version)"; editorModal(normalizeRecipe(r)); },
  "save-recipe": () => saveRecipeForm(),
  "estimate": () => estimateNutrition(),
  "del-recipe-ask": el => { $("#del-confirm").innerHTML = `<div class="notice warn"><div>Delete this recipe? Planned meals using it go back to suggestions.</div><button class="btn btn-sm btn-danger" data-act="del-recipe" data-id="${esc(el.dataset.id)}">Delete recipe</button></div>`; },
  "del-recipe": el => { delete S.recipes[el.dataset.id]; persist("recipe_" + el.dataset.id); closeModal(true); render(); toast("Recipe deleted"); },
  "scan": () => { scan.found = []; scan.msg = ""; scannerModal(); },
  "scan-import": () => { scan.found = []; scan.msg = ""; scan.tab = "file"; scannerModal(); },
  "scan-tab": el => { const ta = $("#scan-text"); if (ta) scan.draft = ta.value; scan.tab = el.dataset.v; scan.msg = ""; scannerModal(); },
  "run-scan-text": () => { const t = $("#scan-text").value.trim(); scan.draft = t; if (!t) { setScanStatus("Paste a recipe first."); return; } runScan(chunkText(t).map(c => ({prompt:scannerPrompt("text", c)}))); },
  "run-scan-photos": async () => { const files = [...($("#scan-photos").files || [])]; if (!files.length) { setScanStatus("Choose at least one photo."); return; }
    const sample = await cap("sample"); const lim = sample && await sample.limits().catch(() => null); const max = (lim && lim.images && lim.images.maxCount) || 1;
    const jobs = []; for (let i = 0; i < files.length; i += max) jobs.push({prompt:scannerPrompt("photo"), images:files.slice(i, i + max)}); runScan(jobs); },
  "run-import": () => runImport(),
  "stop-scan": () => { if (scan.ctl) scan.ctl.abort(); },
  "discard-scan": () => { scan.found = []; scan.msg = ""; scannerModal(); },
  "edit-found": el => { const i = +el.dataset.i; const r = scan.found[i]; editorModal(r);
    const save = $("[data-act=save-recipe]"); save.dataset.act = "save-found-one"; save.dataset.i = i; save.textContent = "Save changes"; },
  "save-found-one": el => { const i = +el.dataset.i; const r = readRecipeForm(); scan.found[i] = r; scannerModal(); },
  "save-found": () => { if (!needReady()) return; let n = 0; scan.found.forEach((r, i) => { if (scan.sel[i]) { S.recipes[r.id] = r; persist("recipe_" + r.id); n++; } });
    scan.found = []; scan.draft = ""; closeModal(true); ui.rSource = "mine"; ui.rFit = false; go("recipes"); toast(`Saved ${n} recipe${n === 1 ? "" : "s"}`); },
  "copy-list": () => copyText(groceryText(), "Grocery list"),
  "clear-checked": () => { S.grocery.checked = {}; S.grocery.extras = S.grocery.extras.filter(x => !x.done); persist("grocery"); render(); toast("Cleared checked items"); },
  "del-extra": el => { S.grocery.extras = S.grocery.extras.filter(x => x.id !== el.dataset.id); persist("grocery"); render(); },
  "logday": el => { ui.logDate = addDays(ui.logDate, +el.dataset.dir); if (ui.logDate > ui.today) ui.logDate = ui.today; render(); },
  "logtoday": () => { ui.logDate = ui.today; render(); },
  "add-food": () => foodModal(),
  "save-food": () => saveFood(),
  "del-meal": el => { const d = ui.logDate, log = clone(getLog(d)); log.meals = log.meals.filter(m => m.id !== el.dataset.id); saveLog(d, log); render(); },
  "customize-brand": () => { const b = brandInfo(); S.settings.customPrenatal = {iron:+b.iron||0, folate:+b.folate||0, vitD:+b.vitD||0, vitB12:+b.vitB12||0, calcium:+b.calcium||0, dha:+b.dha||0}; S.settings.prenatalBrand = "custom"; persist("settings"); render(); },
  "export": () => doExport(),
  "erase-ask": () => { $("#erase-confirm").innerHTML = `<div class="notice warn"><div><b>Erase everything?</b> This deletes your recipes, plan, logs, and settings. Export a backup first if you might want them.</div><button class="btn btn-sm btn-danger" data-act="erase">Erase all data</button></div>`; },
  "erase": () => {
    const keys = ["settings","plan","grocery", ...Object.keys(S.recipes).map(k => "recipe_" + k), ...Object.keys(S.logs).map(k => "log_" + k)];
    S.settings = clone(DEFAULT_SETTINGS); S.plan = {days:{}}; S.grocery = {checked:{}, extras:[]}; S.recipes = {}; S.logs = {};
    keys.forEach(k => persist(k)); go("today"); toast("All data erased");
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.set) {
    if (!needReady()) { render(); return; }
    const path = t.dataset.set.split("."); let v = t.type === "checkbox" ? t.checked : t.type === "number" ? (t.value === "" ? 0 : +t.value) : t.value;
    if (path[0] === "cycleLen") v = clamp(v, 21, 45);
    if (path[0] === "periodLen") v = clamp(v, 2, 10);
    if (path[0] === "household") v = clamp(v, 1, 12);
    if (path[0] === "proteinGoal") v = clamp(v, 10, 120);
    if (path[0] === "fiberGoal") v = clamp(v, 10, 80);
    if (path.length === 2) S.settings[path[0]][path[1]] = v; else S.settings[path[0]] = v;
    if (path[0] === "lastPeriod" && isDate(v)) { S.settings.periodStarts = [...new Set([...(S.settings.periodStarts || []), v])]; S.settings.setupDone = true; }
    if (path[0] === "dueDate" && isDate(v)) S.settings.setupDone = true;
    persist("settings"); render(); return;
  }
  const c = t.dataset.change;
  if (c === "override") { if (!needReady()) return; S.settings.phaseOverride = t.value; persist("settings"); render(); toast(t.value ? "Phase set to " + PHASES[t.value].name : "Using calculated phase"); }
  if (c === "prenatal") { if (!needReady()) return; const d = t.dataset.date, log = clone(getLog(d)); log.prenatal = t.checked; saveLog(d, log); render(); toast(t.checked ? "Prenatal logged" : "Prenatal unmarked"); }
  if (c === "gcheck") { S.grocery.checked[t.dataset.key] = t.checked; if (!t.checked) delete S.grocery.checked[t.dataset.key]; persist("grocery"); t.closest(".gitem").classList.toggle("checked", t.checked); }
  if (c === "xcheck") { const x = S.grocery.extras.find(y => y.id === t.dataset.id); if (x) x.done = t.checked; persist("grocery"); t.closest(".gitem").classList.toggle("checked", t.checked); }
  if (c === "found-sel") { scan.sel[+t.dataset.i] = t.checked; const b = $("[data-act=save-found]"); if (b) b.textContent = `Save ${Object.values(scan.sel).filter(Boolean).length} recipe(s)`; }
  if (c === "ff-recipe") { const r = recipeById($("#ff-recipe").value); if (!r) return; const sv = +$("#ff-serv").value || 1;
    if (!$("#ff-name").value || t.id === "ff-recipe") $("#ff-name").value = r.title;
    for (const k of ["protein","carbs","fat","fiber","iron","calcium","vitC"]) $("#ff-" + k).value = r1(r.nut[k] * sv);
    if (t.id === "ff-recipe") $("#ff-slot").value = r.meal; }
});
let searchTimer;
document.addEventListener("input", e => { if (e.target.id === "recipe-search") { clearTimeout(searchTimer); searchTimer = setTimeout(() => { ui.rq = e.target.value; renderRecipeGrid(); }, 120); } });
document.addEventListener("submit", e => {
  if (e.target.id === "extra-form") { e.preventDefault(); const v = $("#extra-name").value.trim(); if (!v) return; S.grocery.extras.push({id:uid(), name:v.slice(0, 80), done:false}); persist("grocery"); render(); const inp = $("#extra-name"); inp && inp.focus(); }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== ui.view && ["today","plan","recipes","grocery","log","profile"].includes(h)) { ui.view = h; render(); } });
setInterval(() => { if (todayStr() !== ui.today) { if (ui.logDate === ui.today) ui.logDate = todayStr(); render(); } }, 60000);

/* ---------- Start ---------- */
(function start(){
  const h = location.hash.slice(1);
  if (["today","plan","recipes","grocery","log","profile"].includes(h)) ui.view = h;
  render();
  initStore().catch(() => { Store.backend = localBackend; Store.kind = "browser"; Store.ready = true; render(); });
})();
</script>
